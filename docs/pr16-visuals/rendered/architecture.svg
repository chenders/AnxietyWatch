<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">AnxietyWatch v3 architecture and data flow</title><desc id="desc">The active live monitoring pipeline routes Polar H10, EMAY Oximeter, and Apple Health observations through SensorRouter into CNS processing, monitoring presentation state, and complication cache output. Oura Cloud, CPAP records, and deterministic fixtures use separate app data or presentation paths. GRDB and HLC, phone-watch transport, existing server mirror sync, and feature-gated Oura BLE are shown as separate foundations rather than one completed chain. Demo-device observations stay outside the production router, HealthKit, and production sessions.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .arrow{fill:none;stroke:#b8c4db;stroke-width:3;marker-end:url(#arrow)} .label{paint-order:stroke;stroke:#0b1020;stroke-width:8px;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b8c4db"/></marker></defs>
<rect width="100%" height="100%" fill="#0b1020"/><text x="70" y="70" font-size="42" fill="#f4f7ff" font-weight="750" text-anchor="start">How AnxietyWatch v3 fits together</text><text x="70" y="110" font-size="22" fill="#b8c4db" font-weight="500" text-anchor="start">Active monitoring, app data, storage/sync foundations, and demos have different boundaries.</text><text x="70" y="168" font-size="19" fill="#72d6a0" font-weight="800" text-anchor="start">ACTIVE LIVE MONITORING PIPELINE</text><rect x="70" y="195" width="310" height="82" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="231" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Polar H10</text><text x="92" y="263" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">BLE actor</tspan></text><rect x="70" y="300" width="310" height="82" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="336" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">EMAY Oximeter</text><text x="92" y="368" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">BLE actor</tspan></text><rect x="70" y="405" width="310" height="82" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="441" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Apple Health</text><text x="92" y="473" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">HealthKit read adapter</tspan></text><rect x="470" y="235" width="310" height="90" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="492" y="271" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">SensorRouter</text><text x="492" y="303" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="492" dy="0">routes supported observations</tspan></text><rect x="470" y="385" width="310" height="105" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="492" y="421" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">CNS processing</text><text x="492" y="453" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="492" dy="0">quality → severity → fusion</tspan><tspan x="492" dy="25">→ monitoring state</tspan></text><rect x="870" y="235" width="310" height="90" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="892" y="271" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Monitoring view model</text><text x="892" y="303" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="892" dy="0">iPhone presentation state</tspan></text><rect x="870" y="385" width="310" height="105" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="892" y="421" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Complication cache</text><text x="892" y="453" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="892" dy="0">watch-facing snapshot output</tspan></text><path class="arrow" d="M380 300 H464"/><text x="397" y="284" font-size="15" fill="#b8c4db" font-weight="500" text-anchor="start">observations</text><path class="arrow" d="M625 325 V379"/><text x="642" y="360" font-size="15" fill="#b8c4db" font-weight="500" text-anchor="start">process</text><path class="arrow" d="M780 438 H864"/><text x="797" y="422" font-size="15" fill="#b8c4db" font-weight="500" text-anchor="start">publish</text><path class="arrow" d="M1025 325 V379"/><text x="1043" y="360" font-size="15" fill="#b8c4db" font-weight="500" text-anchor="start">cache</text><rect x="1260" y="235" width="270" height="255" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2" stroke-dasharray="10 8"/><text x="1282" y="271" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Phased coexistence</text><text x="1282" y="303" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="1282" dy="0">Legacy app services remain</tspan><tspan x="1282" dy="25">during package rollout.</tspan><tspan x="1282" dy="25"></tspan><tspan x="1282" dy="25">This diagram does not</tspan><tspan x="1282" dy="25">claim every source uses</tspan><tspan x="1282" dy="25">the live router.</tspan></text><text x="70" y="565" font-size="19" fill="#bd9cff" font-weight="800" text-anchor="start">SEPARATE APP DATA / PRESENTATION PATHS</text><rect x="70" y="590" width="315" height="105" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="92" y="626" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura Cloud</text><text x="92" y="658" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">daily API summaries</tspan></text><rect x="415" y="590" width="315" height="105" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="437" y="626" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">CPAP</text><text x="437" y="658" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="437" dy="0">imported session records</tspan></text><rect x="760" y="590" width="315" height="105" rx="18" fill="#151d32" stroke="#f3c969" stroke-width="2" stroke-dasharray="10 8"/><text x="782" y="626" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Deterministic fixtures</text><text x="782" y="658" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="782" dy="0">seeded demo-store content</tspan></text><rect x="1110" y="590" width="420" height="105" rx="18" fill="#151d32" stroke="#63d7d0" stroke-width="2"/><text x="1132" y="626" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Source-aware app surfaces</text><text x="1132" y="658" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="1132" dy="0">Dashboard · Oura · Trends</tspan><tspan x="1132" dy="25">Journal · Settings</tspan></text><path class="arrow" d="M385 642 H1104"/><text x="690" y="626" font-size="15" fill="#b8c4db" font-weight="500" text-anchor="start">separate presentation/data paths</text><text x="70" y="765" font-size="19" fill="#72b7ff" font-weight="800" text-anchor="start">FOUNDATIONS — NOT DRAWN AS ONE COMPLETED CHAIN</text><rect x="70" y="790" width="345" height="92" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="92" y="826" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Local GRDB + HLC</text><text x="92" y="858" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">package storage/sync foundation</tspan></text><rect x="445" y="790" width="345" height="92" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2" stroke-dasharray="10 8"/><text x="467" y="826" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Phone ↔ Watch</text><text x="467" y="858" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="467" dy="0">legacy path + package transport foundation</tspan></text><rect x="820" y="790" width="345" height="92" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="842" y="826" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Existing app sync</text><text x="842" y="858" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="842" dy="0">pushes to personal server mirror</tspan></text><rect x="1195" y="790" width="345" height="92" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2" stroke-dasharray="10 8"/><text x="1217" y="826" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura BLE</text><text x="1217" y="858" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="1217" dy="0">feature-gated · key required · hardware-dependent</tspan></text><text x="70" y="925" font-size="20" fill="#f3c969" font-weight="700" text-anchor="start">Demo-device observations do not enter the production router, HealthKit, or production sensor sessions.</text></svg>