<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280" role="img" aria-labelledby="title desc">
<title id="title">AnxietyWatch v3 architecture and data flow</title><desc id="desc">On iPhone, Polar H10, EMAY Oximeter, and Apple Health each connect to SensorRouter, then package event processing, fusion, tier state, and the monitoring view model. A separate watch HealthKit-only router drives the complication feed and cache. Oura Cloud, CPAP, deterministic fixtures, GRDB and HLC, existing server sync, WatchConnectivity, and feature-gated Oura BLE are separate paths or foundations. Oura BLE requires a 16-byte shared key; physical Ring 5 protocol, decryption, and key validation are not completed.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .arrow{fill:none;stroke:#b8c4db;stroke-width:3;marker-end:url(#arrow)} .label{paint-order:stroke;stroke:#0b1020;stroke-width:8px;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b8c4db"/></marker></defs>
<rect width="100%" height="100%" fill="#0b1020"/><text x="70" y="70" font-size="42" fill="#f4f7ff" font-weight="750" text-anchor="start">How AnxietyWatch v3 fits together</text><text x="70" y="110" font-size="22" fill="#b8c4db" font-weight="500" text-anchor="start">Active iPhone monitoring, watch runtime, app data, and foundations remain distinct.</text><text x="70" y="165" font-size="19" fill="#72d6a0" font-weight="800" text-anchor="start">ACTIVE IPHONE MONITORING</text><rect x="70" y="190" width="270" height="82" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="226" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Polar H10</text><text x="92" y="258" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">BLE actor</tspan></text><path class="arrow" d="M205 272 V315 H570 V350"/><rect x="370" y="190" width="270" height="82" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="392" y="226" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">EMAY Oximeter</text><text x="392" y="258" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="392" dy="0">BLE actor</tspan></text><path class="arrow" d="M505 272 V315 H605 V350"/><rect x="670" y="190" width="270" height="82" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="692" y="226" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Apple Health</text><text x="692" y="258" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="692" dy="0">HealthKit read adapter</tspan></text><path class="arrow" d="M805 272 V315 H640 V350"/><rect x="480" y="350" width="350" height="88" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="502" y="386" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">SensorRouter</text><text x="502" y="418" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="502" dy="0">routes supported observations</tspan></text><rect x="480" y="485" width="350" height="100" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="502" y="521" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Package CNS processing</text><text x="502" y="553" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="502" dy="0">event step → fusion</tspan><tspan x="502" dy="25">→ tier state</tspan></text><rect x="480" y="632" width="350" height="82" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="502" y="668" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Monitoring view model</text><text x="502" y="700" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="502" dy="0">iPhone presentation state</tspan></text><path class="arrow" d="M655 438 V479"/><path class="arrow" d="M655 585 V626"/><rect x="940" y="190" width="590" height="245" rx="18" fill="#151d32" stroke="#63d7d0" stroke-width="2" stroke-dasharray="10 8"/><text x="962" y="226" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Separate watch runtime</text><text x="962" y="258" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="962" dy="0">Apple Health / HealthKit-only router</tspan><tspan x="962" dy="25">→ complication feed and cache</tspan><tspan x="962" dy="25">Not a direct continuation of the iPhone view model</tspan></text><rect x="940" y="485" width="590" height="229" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2" stroke-dasharray="10 8"/><text x="962" y="521" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Phased coexistence</text><text x="962" y="553" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="962" dy="0">Legacy app services remain during package rollout.</tspan><tspan x="962" dy="25">Existing WatchConnectivity path is active;</tspan><tspan x="962" dy="25">package peer transport is a foundation and</tspan><tspan x="962" dy="25">watch migration is incomplete.</tspan></text><text x="70" y="780" font-size="19" fill="#bd9cff" font-weight="800" text-anchor="start">SEPARATE APP DATA / PRESENTATION PATHS</text><rect x="70" y="805" width="335" height="100" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="92" y="841" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura Cloud</text><text x="92" y="873" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">daily API summaries</tspan></text><rect x="435" y="805" width="335" height="100" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="457" y="841" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">CPAP</text><text x="457" y="873" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="457" dy="0">imported session records</tspan></text><rect x="800" y="805" width="335" height="100" rx="18" fill="#151d32" stroke="#f3c969" stroke-width="2" stroke-dasharray="10 8"/><text x="822" y="841" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Deterministic fixtures</text><text x="822" y="873" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="822" dy="0">seeded demo-store content</tspan></text><rect x="1165" y="805" width="365" height="100" rx="18" fill="#151d32" stroke="#63d7d0" stroke-width="2"/><text x="1187" y="841" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Source-aware app surfaces</text><text x="1187" y="873" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="1187" dy="0">Dashboard · Oura · Trends · Journal</tspan></text><text x="70" y="975" font-size="19" fill="#72b7ff" font-weight="800" text-anchor="start">SEPARATE FOUNDATIONS — NOT ONE COMPLETED CHAIN</text><rect x="70" y="1000" width="420" height="112" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="92" y="1036" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Local GRDB + HLC</text><text x="92" y="1068" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">package storage/sync foundation</tspan></text><rect x="540" y="1000" width="420" height="112" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="562" y="1036" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Existing app sync</text><text x="562" y="1068" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="562" dy="0">pushes to personal server mirror</tspan></text><rect x="1010" y="1000" width="520" height="148" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2" stroke-dasharray="10 8"/><text x="1032" y="1036" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura BLE foundation</text><text x="1032" y="1068" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="1032" dy="0">Feature-gated; 16-byte shared key required;</tspan><tspan x="1032" dy="25">physical Ring 5 protocol, decryption,</tspan><tspan x="1032" dy="25">and key validation not completed.</tspan></text><text x="70" y="1200" font-size="20" fill="#f3c969" font-weight="700" text-anchor="start">Demo-device observations do not enter the production router, HealthKit, or production sensor sessions.</text><text x="70" y="1235" font-size="20" fill="#b8c4db" font-weight="650" text-anchor="start">HealthKit remains the physiological source of truth; the personal server is a push-oriented mirror.</text></svg>