<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1815" viewBox="0 0 720 1815" role="img" aria-labelledby="title desc">
<title id="title">AnxietyWatch source provenance and demo boundaries — mobile</title><desc id="desc">A stacked mobile version listing Oura Cloud, Apple Health, Polar H10, EMAY and CPAP as distinct sources. Oura BLE is an incomplete feature-gated foundation requiring a 16-byte key. Simulated device observations and the scripted CNS demonstration remain isolated from production behavior.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .arrow{fill:none;stroke:#b8c4db;stroke-width:3;marker-end:url(#arrow)} .label{paint-order:stroke;stroke:#0b1020;stroke-width:8px;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b8c4db"/></marker></defs>
<rect width="100%" height="100%" fill="#0b1020"/><text x="40" y="65" font-size="34" fill="#f4f7ff" font-weight="750" text-anchor="start">Source-aware — demos stop here</text><text x="40" y="108" font-size="22" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="40" dy="0">Selected surfaces name source or mode.</tspan><tspan x="40" dy="30">Simulation is not a hardware reading.</tspan></text><text x="40" y="200" font-size="20" fill="#72d6a0" font-weight="800" text-anchor="start">PRODUCTION / IMPORTED SOURCES</text><rect x="40" y="230" width="640" height="90" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="62" y="266" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">● Oura Cloud</text><text x="62" y="298" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">daily API summaries</tspan></text><rect x="40" y="340" width="640" height="90" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="62" y="376" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">◆ Apple Health</text><text x="62" y="408" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">separate HealthKit read/import source</tspan></text><rect x="40" y="450" width="640" height="90" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="62" y="486" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">■ Polar H10</text><text x="62" y="518" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">hardware sensor path</tspan></text><rect x="40" y="560" width="640" height="90" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="62" y="596" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">■ EMAY Oximeter</text><text x="62" y="628" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">hardware / imported path</tspan></text><rect x="40" y="670" width="640" height="90" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="62" y="706" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">■ CPAP</text><text x="62" y="738" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">imported session data</tspan></text><rect x="40" y="780" width="640" height="155" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2" stroke-dasharray="10 8"/><text x="62" y="816" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura BLE foundation</text><text x="62" y="848" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">Feature-gated; 16-byte shared key required.</tspan><tspan x="62" dy="25">Physical Ring 5 protocol, decryption,</tspan><tspan x="62" dy="25">and key validation not completed.</tspan></text><text x="40" y="980" font-size="20" fill="#f3c969" font-weight="800" text-anchor="start">ISOLATED DEMONSTRATIONS</text><rect x="40" y="1010" width="640" height="240" rx="18" fill="#151d32" stroke="#f3c969" stroke-width="2" stroke-dasharray="10 8"/><text x="62" y="1046" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">◇ Simulated Polar + EMAY</text><text x="62" y="1078" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">DETERMINISTIC · HARDWARE-FREE</tspan><tspan x="62" dy="25">six-hour logical demo clock</tspan><tspan x="62" dy="25">⊘ No production BLE or sensor session</tspan><tspan x="62" dy="25">⊘ No HealthKit writes</tspan><tspan x="62" dy="25">⊘ Not saved as readings</tspan></text><rect x="40" y="1280" width="640" height="220" rx="18" fill="#151d32" stroke="#f3c969" stroke-width="2" stroke-dasharray="10 8"/><text x="62" y="1316" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">◇ Isolated CNS UI demo</text><text x="62" y="1348" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">scripted: Clear → Watch → Confirm → Klaxon</tspan><tspan x="62" dy="25">separate from production tier naming</tspan><tspan x="62" dy="25">⊘ No production monitoring or real notification</tspan><tspan x="62" dy="25">⊘ No diagnosis or clinical certainty</tspan></text><rect x="40" y="1540" width="640" height="135" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="62" y="1576" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Seeded application fixtures</text><text x="62" y="1608" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">Deterministic fixtures may be written to the</tspan><tspan x="62" dy="25">demo store for screenshots; they are distinct</tspan><tspan x="62" dy="25">from simulated device observations.</tspan></text><text x="40" y="1715" font-size="22" fill="#f4f7ff" font-weight="700" text-anchor="start"><tspan x="40" dy="0">All displayed health values in these aids are</tspan><tspan x="40" dy="31">fictional, deterministic simulator content.</tspan></text></svg>