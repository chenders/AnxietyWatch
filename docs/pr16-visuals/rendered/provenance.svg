<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
<title id="title">AnxietyWatch source provenance and demo boundaries</title><desc id="desc">Selected Oura and demo surfaces show source or mode labels. Oura Cloud, Apple Health, Polar H10, EMAY and CPAP remain distinct sources. Feature-gated Oura BLE requires a 16-byte shared key; physical Ring 5 protocol, decryption, and key validation are not completed. Simulated Polar and EMAY observations activate no production Bluetooth or sensor session, write no HealthKit data, and are not saved as readings. The scripted CNS UI demonstration neither arms production monitoring nor sends a real notification or diagnosis. Deterministic application fixtures may be seeded into the demo store for screenshots.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .arrow{fill:none;stroke:#b8c4db;stroke-width:3;marker-end:url(#arrow)} .label{paint-order:stroke;stroke:#0b1020;stroke-width:8px;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b8c4db"/></marker></defs>
<rect width="100%" height="100%" fill="#0b1020"/><text x="70" y="70" font-size="42" fill="#f4f7ff" font-weight="750" text-anchor="start">Source-aware where shown — demos stop at the boundary</text><text x="70" y="110" font-size="22" fill="#b8c4db" font-weight="500" text-anchor="start">Selected surfaces label source or mode; simulation is never presented as a hardware reading.</text><text x="70" y="170" font-size="19" fill="#72d6a0" font-weight="800" text-anchor="start">PRODUCTION / IMPORTED SOURCES</text><rect x="70" y="195" width="490" height="88" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="92" y="231" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura Cloud</text><text x="92" y="263" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">daily API summaries</tspan></text><rect x="70" y="307" width="490" height="88" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="343" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Apple Health</text><text x="92" y="375" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">separate HealthKit read/import source</tspan></text><rect x="70" y="419" width="490" height="88" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="455" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Polar H10</text><text x="92" y="487" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">hardware sensor path</tspan></text><rect x="70" y="531" width="490" height="88" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="567" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">EMAY Oximeter</text><text x="92" y="599" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">hardware / imported path</tspan></text><rect x="70" y="643" width="490" height="88" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="92" y="679" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">CPAP</text><text x="92" y="711" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="92" dy="0">imported session data</tspan></text><rect x="610" y="195" width="350" height="550" rx="28" fill="#1b2640" stroke="#72b7ff" stroke-width="3"/><text x="785" y="242" font-size="27" fill="#f4f7ff" font-weight="750" text-anchor="middle">Visible label examples</text><text x="645" y="292" font-size="21" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="645" dy="0">Selected Oura and demo</tspan><tspan x="645" dy="30">surfaces identify source/mode.</tspan></text><text x="650" y="385" font-size="28" fill="#bd9cff" font-weight="800" text-anchor="start">●</text><text x="695" y="382" font-size="20" fill="#f4f7ff" font-weight="650" text-anchor="start">Oura Cloud</text><text x="650" y="447" font-size="28" fill="#72d6a0" font-weight="800" text-anchor="start">◆</text><text x="695" y="444" font-size="20" fill="#f4f7ff" font-weight="650" text-anchor="start">Apple Health / import</text><text x="650" y="509" font-size="28" fill="#63d7d0" font-weight="800" text-anchor="start">■</text><text x="695" y="506" font-size="20" fill="#f4f7ff" font-weight="650" text-anchor="start">Live sensor</text><text x="650" y="571" font-size="28" fill="#f3c969" font-weight="800" text-anchor="start">◇</text><text x="695" y="568" font-size="20" fill="#f4f7ff" font-weight="650" text-anchor="start">Demo / simulated</text><rect x="645" y="635" width="280" height="78" rx="12" fill="#0b1020" stroke="#bd9cff"/><text x="665" y="662" font-size="16" fill="#bd9cff" font-weight="700" text-anchor="start"><tspan x="665" dy="0">Oura BLE foundation</tspan><tspan x="665" dy="20">16-byte shared key required</tspan><tspan x="665" dy="20">physical validation incomplete</tspan></text><text x="1010" y="170" font-size="19" fill="#f3c969" font-weight="800" text-anchor="start">ISOLATED DEMONSTRATIONS</text><rect x="1010" y="195" width="520" height="250" rx="18" fill="#151d32" stroke="#f3c969" stroke-width="2" stroke-dasharray="10 8"/><text x="1032" y="231" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Simulated Polar + EMAY session</text><text x="1032" y="263" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="1032" dy="0">DETERMINISTIC · HARDWARE-FREE</tspan><tspan x="1032" dy="25">six-hour logical demo clock</tspan></text><text x="1045" y="332" font-size="18" fill="#f4f7ff" font-weight="650" text-anchor="start"><tspan x="1045" dy="0">⊘ No production BLE or sensor session</tspan><tspan x="1045" dy="31">⊘ No HealthKit writes</tspan><tspan x="1045" dy="31">⊘ Simulated observations are not saved as readings</tspan></text><rect x="1010" y="480" width="520" height="265" rx="18" fill="#151d32" stroke="#f3c969" stroke-width="2" stroke-dasharray="10 8"/><text x="1032" y="516" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Isolated CNS UI demonstration</text><text x="1032" y="548" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="1032" dy="0">scripted: Clear → Watch → Confirm → Klaxon</tspan><tspan x="1032" dy="25">separate from production tier naming</tspan></text><text x="1045" y="630" font-size="18" fill="#f4f7ff" font-weight="650" text-anchor="start"><tspan x="1045" dy="0">⊘ No production monitoring or real notification</tspan><tspan x="1045" dy="32">⊘ No diagnosis or clinical certainty</tspan></text><path d="M985 195 V745" stroke="#f3c969" stroke-width="4" stroke-dasharray="12 10"/><text x="1000" y="782" font-size="16" fill="#f3c969" font-weight="800" text-anchor="start">ISOLATION BOUNDARY</text><rect x="70" y="820" width="1460" height="100" rx="18" fill="#151d32" stroke="#53637f"/><text x="800" y="858" font-size="21" fill="#f4f7ff" font-weight="700" text-anchor="middle">Deterministic app fixtures may be seeded into the demo store for screenshots.</text><text x="800" y="891" font-size="19" fill="#b8c4db" font-weight="600" text-anchor="middle">Physical Ring 5 protocol, decryption, and key validation are not completed.</text></svg>