<svg xmlns="http://www.w3.org/2000/svg" width="720" height="2338" viewBox="0 0 720 2338" role="img" aria-labelledby="title desc">
<title id="title">AnxietyWatch v3 architecture and data flow — mobile</title><desc id="desc">A stacked mobile version of the architecture. Three iPhone sources feed SensorRouter, package event processing, fusion, tier state, and iPhone presentation. The watch HealthKit-only runtime, app-data paths, storage, server sync, WatchConnectivity, and incomplete Oura BLE foundation are separate.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif} .arrow{fill:none;stroke:#b8c4db;stroke-width:3;marker-end:url(#arrow)} .label{paint-order:stroke;stroke:#0b1020;stroke-width:8px;stroke-linejoin:round}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#b8c4db"/></marker></defs>
<rect width="100%" height="100%" fill="#0b1020"/><text x="40" y="65" font-size="34" fill="#f4f7ff" font-weight="750" text-anchor="start">How AnxietyWatch v3 fits together</text><text x="40" y="108" font-size="22" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="40" dy="0">Active iPhone monitoring, watch runtime, app data,</tspan><tspan x="40" dy="30">and foundations remain distinct.</tspan></text><text x="40" y="205" font-size="20" fill="#72d6a0" font-weight="800" text-anchor="start">ACTIVE IPHONE MONITORING</text><rect x="40" y="235" width="640" height="90" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="62" y="271" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Polar H10</text><text x="62" y="303" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">BLE actor → router</tspan></text><rect x="40" y="345" width="640" height="90" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="62" y="381" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">EMAY Oximeter</text><text x="62" y="413" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">BLE actor → router</tspan></text><rect x="40" y="455" width="640" height="90" rx="18" fill="#151d32" stroke="#72d6a0" stroke-width="2"/><text x="62" y="491" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Apple Health</text><text x="62" y="523" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">HealthKit read adapter → router</tspan></text><rect x="40" y="565" width="640" height="96" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="62" y="601" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">SensorRouter</text><text x="62" y="633" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">routes supported observations</tspan></text><path class="arrow" d="M360 661 V673"/><rect x="40" y="681" width="640" height="96" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="62" y="717" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Package CNS processing</text><text x="62" y="749" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">event step → fusion → tier state</tspan></text><path class="arrow" d="M360 777 V789"/><rect x="40" y="797" width="640" height="96" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="62" y="833" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Monitoring view model</text><text x="62" y="865" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">iPhone presentation state</tspan></text><text x="40" y="933" font-size="20" fill="#63d7d0" font-weight="800" text-anchor="start">SEPARATE WATCH RUNTIME</text><rect x="40" y="958" width="640" height="155" rx="18" fill="#151d32" stroke="#63d7d0" stroke-width="2" stroke-dasharray="10 8"/><text x="62" y="994" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Watch HealthKit-only path</text><text x="62" y="1026" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">Apple Health → SensorRouter</tspan><tspan x="62" dy="25">→ complication feed and cache</tspan><tspan x="62" dy="25">Not an iPhone-view-model continuation</tspan></text><rect x="40" y="1143" width="640" height="175" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2" stroke-dasharray="10 8"/><text x="62" y="1179" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Phased coexistence</text><text x="62" y="1211" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">Legacy services remain during rollout.</tspan><tspan x="62" dy="25">Existing WatchConnectivity path is active;</tspan><tspan x="62" dy="25">package peer transport is a foundation;</tspan><tspan x="62" dy="25">watch migration is incomplete.</tspan></text><text x="40" y="1358" font-size="20" fill="#bd9cff" font-weight="800" text-anchor="start">SEPARATE APP DATA</text><rect x="40" y="1388" width="640" height="90" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="62" y="1424" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura Cloud</text><text x="62" y="1456" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">daily API summaries</tspan></text><rect x="40" y="1498" width="640" height="90" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2"/><text x="62" y="1534" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">CPAP</text><text x="62" y="1566" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">imported session records</tspan></text><rect x="40" y="1608" width="640" height="90" rx="18" fill="#151d32" stroke="#f3c969" stroke-width="2" stroke-dasharray="10 8"/><text x="62" y="1644" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Deterministic fixtures</text><text x="62" y="1676" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">seeded demo-store content; not observations</tspan></text><text x="40" y="1728" font-size="20" fill="#72b7ff" font-weight="800" text-anchor="start">SEPARATE FOUNDATIONS</text><rect x="40" y="1758" width="640" height="90" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="62" y="1794" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Local GRDB + HLC</text><text x="62" y="1826" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">package storage/sync foundation</tspan></text><rect x="40" y="1868" width="640" height="90" rx="18" fill="#151d32" stroke="#72b7ff" stroke-width="2"/><text x="62" y="1904" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Existing app sync</text><text x="62" y="1936" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">pushes to personal server mirror</tspan></text><rect x="40" y="1978" width="640" height="165" rx="18" fill="#151d32" stroke="#bd9cff" stroke-width="2" stroke-dasharray="10 8"/><text x="62" y="2014" font-size="23" fill="#f4f7ff" font-weight="700" text-anchor="start">Oura BLE foundation</text><text x="62" y="2046" font-size="18" fill="#b8c4db" font-weight="500" text-anchor="start"><tspan x="62" dy="0">Feature-gated; 16-byte shared key required.</tspan><tspan x="62" dy="25">Physical Ring 5 protocol, decryption,</tspan><tspan x="62" dy="25">and key validation not completed.</tspan></text><text x="40" y="2183" font-size="21" fill="#f3c969" font-weight="700" text-anchor="start"><tspan x="40" dy="0">Demo-device observations do not enter the production</tspan><tspan x="40" dy="31">router, HealthKit, or production sensor sessions.</tspan><tspan x="40" dy="31">HealthKit is the physiological source of truth;</tspan><tspan x="40" dy="31">the personal server is a push-oriented mirror.</tspan></text></svg>