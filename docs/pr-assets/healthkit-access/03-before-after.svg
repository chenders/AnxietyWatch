<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" width="940" height="480">
  <rect width="940" height="480" fill="#0d1117" rx="16"/>
  <text x="40" y="50" fill="#e6edf3" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="bold">The fix: trust the data, ask once</text>
  <text x="40" y="80" fill="#8b949e" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="16">Using the data probe as our primary truth signal to bypass OS black holes</text>

  <!-- Left: BEFORE -->
  <g transform="translate(40, 130)">
    <rect width="410" height="320" fill="#161b22" rx="12" stroke="#30363d" stroke-width="2"/>
    <path d="M 0 40 L 410 40" stroke="#30363d" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="40" fill="#f85149" opacity="0.1" rx="12"/>
    <text x="205" y="26" fill="#f85149" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">BEFORE (Gate wins)</text>
    
    <g transform="translate(30, 70)">
      <circle cx="10" cy="10" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="15" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">1</text>
      <text x="30" y="15" fill="#e6edf3" font-family="sans-serif" font-size="15">Data <tspan fill="#3fb950" font-weight="bold">IS</tspan> flowing in HealthKit</text>
      
      <circle cx="10" cy="50" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="55" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">2</text>
      <text x="30" y="55" fill="#e6edf3" font-family="sans-serif" font-size="15">getRequestStatus says <tspan fill="#d2a8ff">.shouldRequest</tspan></text>
      
      <path d="M 10 70 L 10 95" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead-gray)"/>
      
      <rect x="30" y="80" width="300" height="65" fill="#da3633" rx="8" opacity="0.15" stroke="#da3633" stroke-width="2"/>
      <text x="45" y="105" fill="#ff7b72" font-family="sans-serif" font-size="15" font-weight="bold">verdict = .notRequested</text>
      <text x="45" y="130" fill="#ff7b72" font-family="sans-serif" font-size="14">"Apple Health isn't connected" (false alarm)</text>
      
      <path d="M 10 135 L 10 175" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead-gray)"/>
      
      <circle cx="10" cy="190" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="195" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">3</text>
      <text x="30" y="195" fill="#e6edf3" font-family="sans-serif" font-size="15">Every tap re-asks OS → <tspan fill="#f85149" font-weight="bold">Black screen (~10s)</tspan></text>
      
      <circle cx="10" cy="230" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="235" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">4</text>
      <text x="30" y="235" fill="#e6edf3" font-family="sans-serif" font-size="15">Ingestion takes the reduced pass,</text>
      <text x="30" y="255" fill="#8b949e" font-family="sans-serif" font-size="13">skips HealthKit &amp; manufactures a freeze.</text>
    </g>
  </g>

  <!-- Right: AFTER -->
  <g transform="translate(490, 130)">
    <rect width="410" height="320" fill="#161b22" rx="12" stroke="#30363d" stroke-width="2"/>
    <path d="M 0 40 L 410 40" stroke="#30363d" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="40" fill="#3fb950" opacity="0.1" rx="12"/>
    <text x="205" y="26" fill="#3fb950" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">AFTER (Real read wins)</text>

    <g transform="translate(30, 70)">
      <circle cx="10" cy="10" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="15" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">1</text>
      <text x="30" y="15" fill="#e6edf3" font-family="sans-serif" font-size="15">Data probe checked first</text>
      
      <circle cx="10" cy="50" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="55" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">2</text>
      <text x="30" y="55" fill="#e6edf3" font-family="sans-serif" font-size="15">Probe sees data in HealthKit</text>
      
      <path d="M 10 70 L 10 95" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead-gray)"/>
      
      <rect x="30" y="80" width="300" height="65" fill="#238636" rx="8" opacity="0.15" stroke="#238636" stroke-width="2"/>
      <text x="45" y="105" fill="#3fb950" font-family="sans-serif" font-size="15" font-weight="bold">verdict = .receiving</text>
      <text x="45" y="130" fill="#3fb950" font-family="sans-serif" font-size="14">Banner hidden entirely</text>
      
      <path d="M 10 135 L 10 175" stroke="#8b949e" stroke-width="2" marker-end="url(#arrowhead-gray)"/>
      
      <circle cx="10" cy="190" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="195" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">3</text>
      <text x="30" y="195" fill="#e6edf3" font-family="sans-serif" font-size="15"><tspan font-weight="bold">Request once ever</tspan> (persisted flag)</text>
      
      <circle cx="10" cy="230" r="10" fill="#21262d" stroke="#8b949e"/>
      <text x="10" y="235" fill="#8b949e" font-size="12" font-family="sans-serif" text-anchor="middle">4</text>
      <text x="30" y="235" fill="#e6edf3" font-family="sans-serif" font-size="15">Later taps route to Settings</text>
      <text x="30" y="255" fill="#8b949e" font-family="sans-serif" font-size="13">(No black host view anymore!)</text>
    </g>
  </g>

  <!-- Defs -->
  <defs>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#8b949e" />
    </marker>
  </defs>
</svg>
