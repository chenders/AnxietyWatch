<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <rect x="0" y="0" width="940" height="470" rx="18" fill="#0d1117"/>
  <text x="34" y="52" fill="#e6edf3" font-size="26" font-weight="700">The dark screen isn&#39;t ours &#8212; it&#39;s a whole other app</text>
  <text x="34" y="82" fill="#8b949e" font-size="16">Tapping the banner calls requestAuthorization, which hands the screen to a separate iOS process.</text>

  <!-- Phone -->
  <g transform="translate(70,110)">
    <rect x="0" y="0" width="230" height="330" rx="34" fill="#161b22" stroke="#30363d" stroke-width="3"/>
    <rect x="14" y="16" width="202" height="298" rx="22" fill="#0b0f14"/>
    <!-- dashboard content (visible underneath) -->
    <text x="30" y="58" fill="#e6edf3" font-size="18" font-weight="700">Dashboard</text>
    <rect x="30" y="74" width="170" height="40" rx="8" fill="#3a2a12" stroke="#9a6700" stroke-width="1"/>
    <text x="40" y="99" fill="#e3b341" font-size="11">Apple Health isn&#39;t connected</text>
    <rect x="30" y="126" width="170" height="52" rx="8" fill="#161b22"/>
    <text x="42" y="150" fill="#f85149" font-size="14" font-weight="700">72</text><text x="60" y="150" fill="#8b949e" font-size="10">bpm</text>
    <text x="120" y="150" fill="#3fb950" font-size="12">normal</text>
    <rect x="30" y="190" width="170" height="52" rx="8" fill="#161b22"/>
    <rect x="30" y="254" width="170" height="46" rx="8" fill="#161b22"/>

    <!-- black takeover panel -->
    <g>
      <rect x="14" y="16" width="202" height="298" rx="22" fill="#000000">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.15;0.35;0.85;1" dur="5s" repeatCount="indefinite"/>
      </rect>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.4;0.85;1" dur="5s" repeatCount="indefinite"/>
        <text x="115" y="150" fill="#6e7681" font-size="11" text-anchor="middle">9:41</text>
        <text x="115" y="175" fill="#484f58" font-size="10" text-anchor="middle">(nothing renders here)</text>
      </g>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(320,270)">
    <path d="M0 0 H120" stroke="#484f58" stroke-width="3"/>
    <path d="M112 -8 L128 0 L112 8 Z" fill="#484f58"/>
    <text x="6" y="-14" fill="#8b949e" font-size="12">presents</text>
  </g>

  <!-- OS process box -->
  <g transform="translate(470,150)">
    <rect x="0" y="0" width="410" height="250" rx="16" fill="#161b22" stroke="#f85149" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="24" y="42" fill="#f85149" font-size="18" font-weight="700">com.apple.HealthPrivacyService</text>
    <text x="24" y="66" fill="#8b949e" font-size="13">a different process &#8212; hosted full-screen in your window</text>

    <!-- stopwatch -->
    <g transform="translate(70,150)">
      <circle cx="0" cy="0" r="46" fill="#0b0f14" stroke="#6e7681" stroke-width="3"/>
      <rect x="-8" y="-58" width="16" height="10" rx="2" fill="#6e7681"/>
      <line x1="0" y1="0" x2="0" y2="-34" stroke="#f85149" stroke-width="3" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="2.5s" repeatCount="indefinite"/>
      </line>
      <circle cx="0" cy="0" r="4" fill="#f85149"/>
    </g>
    <text x="150" y="140" fill="#e6edf3" font-size="15" font-weight="700">~10s</text>
    <text x="150" y="160" fill="#8b949e" font-size="12">first grant (real sheet)</text>
    <text x="150" y="192" fill="#e6edf3" font-size="15" font-weight="700">~1s</text>
    <text x="150" y="212" fill="#8b949e" font-size="12">even when nothing to ask</text>
    <text x="24" y="238" fill="#6e7681" font-size="12">Its host view is black while it spins up, then it dismisses.</text>
  </g>
</svg>
