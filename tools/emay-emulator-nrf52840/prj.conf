# EMAY SleepO2 emulator — Zephyr config.
#
# Peripheral-only BLE, no security (the real EMAY SleepO2 exposes an
# unauthenticated, unencrypted, unpaired GATT service — we mirror that so the
# AnxietyWatch EMAYRealtimeService connects exactly as it would to real hardware).

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1

# Advertised GAP name. MUST start with "SleepO2": AnxietyWatch's
# EMAYRealtimeService accepts a discovered peripheral only if the advertised
# name is empty OR has prefix "SleepO2" (EMAYRealtimeService.namePrefix).
CONFIG_BT_DEVICE_NAME="SleepO2-SIM"

# Logging (visible over the dongle's USB-CDC console if a backend is present;
# not required for the test — the iPhone UI is the source of truth).
CONFIG_LOG=y

# GPIO for the optional streaming-heartbeat LED.
CONFIG_GPIO=y
