name: iOS CI

on:
  push:
    branches: [main]
    paths-ignore: [server/**, docs/**, '*.md']
  pull_request:
    paths-ignore: [server/**, docs/**, '*.md']

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, macOS, xcode]
    steps:
      - uses: actions/checkout@v7

      # Launchd doesn't inherit your interactive shell PATH, so Homebrew tools
      # (swiftlint, xcbeautify, etc.) won't be found unless we add the prefix.
      - name: Set up PATH for Homebrew
        run: |
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/sbin" >> "$GITHUB_PATH"

      - name: Toolchain info
        run: |
          echo "Xcode: $(xcode-select -p)"
          xcodebuild -version
          echo "Available iOS simulator runtimes:"
          xcrun simctl list runtimes | grep iOS || true

      # CI builds use a per-run DerivedData under RUNNER_TEMP (see the
      # xcodebuild steps below) instead of the runner user's shared
      # ~/Library/.../DerivedData: stale incremental state there produced a
      # bogus single-arch "AnxietyEntry not Identifiable" compile failure on
      # PR #185 in files the PR never touched. RUNNER_TEMP is wiped between
      # runs, so every build is deterministic at the cost of no incremental
      # reuse across runs.

      - name: Find simulator destination
        id: dest
        run: |
          # List available iPhone simulators and pick the first one
          SIM_NAME=$(xcrun simctl list devices available -j \
            | python3 -c "import sys,json; devs=json.load(sys.stdin)['devices']; print(next(d['name'] for rt in devs for d in devs[rt] if 'iPhone' in d['name'] and d['isAvailable']), end='')" 2>/dev/null)
          if [ -z "$SIM_NAME" ]; then
            SIM_NAME="iPhone 16 Pro"
          fi
          echo "sim_name=$SIM_NAME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $SIM_NAME"

      - name: Check deployment targets not in pbxproj
        run: bash scripts/check-deployment-targets.sh

      - name: Generate BuildVersion.swift
        run: SRCROOT="${GITHUB_WORKSPACE}" bash scripts/generate-version.sh

      - name: Verify SwiftLint is available
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            echo "::error::swiftlint is not installed on this runner. Run 'brew install swiftlint' on the runner Mac."
            exit 1
          fi
          swiftlint version

      - name: Run SwiftLint
        # Enforces the "zero violations" policy in CLAUDE.md. Any new
        # violation fails CI — fix the source instead of grandfathering.
        run: swiftlint lint --reporter github-actions-logging --strict

      - name: Verify Semgrep is available
        run: |
          if ! command -v semgrep >/dev/null 2>&1; then
            echo "::error::semgrep is not installed on this runner. Run 'brew install semgrep' on the runner Mac."
            exit 1
          fi
          semgrep --version

      - name: Run Semgrep pitfall rules
        # Project-specific rules in .semgrep/swift-pitfalls.yml encode the
        # SwiftData/SwiftUI/sync-race pitfalls documented in CLAUDE.md.
        # Any rule with severity ERROR blocks merge; severity WARNING surfaces
        # as a PR annotation but does not fail. --error bubbles both up.
        # No untrusted GitHub event data flows into this step.
        run: semgrep --config .semgrep/ --error

      - name: Run tests with coverage
        env:
          SIM_NAME: ${{ steps.dest.outputs.sim_name }}
        run: |
          # Check warnings after the build instead of passing
          # SWIFT_TREAT_WARNINGS_AS_ERRORS globally. Xcode 26 otherwise adds
          # -warnings-as-errors to packages such as GRDB that intentionally use
          # -suppress-warnings, and Swift rejects the conflicting options.
          set -o pipefail
          xcodebuild test \
            -scheme AnxietyWatch \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult 2>&1 | tee "$RUNNER_TEMP/ios-test.log"
          if grep -E '(^|:) warning:' "$RUNNER_TEMP/ios-test.log"; then
            echo "::error::Compiler warnings are not permitted"
            exit 1
          fi

      - name: Report coverage
        if: always()
        run: |
          echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          xcrun xccov view --report TestResults.xcresult 2>/dev/null | grep -E "^AnxietyWatch\.app" >> "$GITHUB_STEP_SUMMARY" || echo "Coverage data not available" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build watchOS app
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme "AnxietyWatch Watch App" \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" 2>&1 | tee "$RUNNER_TEMP/watch-build.log"
          if grep -E '(^|:) warning:' "$RUNNER_TEMP/watch-build.log"; then
            echo "::error::Compiler warnings are not permitted"
            exit 1
          fi
