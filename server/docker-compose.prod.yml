services:
  anxietywatch-db:
    image: postgres:16-alpine
    container_name: anxietywatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anxietywatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anxietywatch}
    ports:
    - 127.0.0.1:5439:5432
    volumes:
    - anxietywatch-pgdata:/var/lib/postgresql/data
    networks:
    - anxietywatch-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-anxietywatch}
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  anxietywatch-app:
    image: ghcr.io/chenders/anxietywatch-server:latest
    container_name: anxietywatch-app
    restart: unless-stopped
    depends_on: &id001
      anxietywatch-db:
        condition: service_healthy
    environment: &id002
      DATABASE_URL: ${DATABASE_URL:-postgresql://anxietywatch:${POSTGRES_PASSWORD}@anxietywatch-db:5432/anxietywatch}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GRAPHQL_API_KEY: ${GRAPHQL_API_KEY:-}
      GENIUS_API_TOKEN: ${GENIUS_API_TOKEN:-}
      MUSIXMATCH_API_KEY: ${MUSIXMATCH_API_KEY:-}
    shm_size: 256mb
    ports:
    - 0.0.0.0:8081:8080
    networks: &id003
    - anxietywatch-net
    healthcheck: &id004
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health',
        timeout=3).close()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy: &id005
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
    logging: &id006
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  anxietywatch-app-ws:
    image: ghcr.io/chenders/anxietywatch-server:latest
    container_name: anxietywatch-app-ws
    restart: unless-stopped
    # Start only after the main app is HEALTHY (its pre-start migrations have
    # run): avoids concurrent-migration contention and transient WS failures
    # during deploy/boot, and makes startup sequencing deterministic.
    depends_on:
      anxietywatch-db:
        condition: service_healthy
      anxietywatch-app:
        condition: service_healthy
    environment: *id002
    shm_size: 256mb
    ports:
    - 0.0.0.0:8082:8080
    networks: *id003
    healthcheck: *id004
    deploy: *id005
    logging: *id006
    command:
    - sh
    - -c
    - exec gunicorn --bind 0.0.0.0:8080 --workers 1 --worker-class gthread --threads
      10 --timeout 120 --access-logfile - 'server:create_app()'
  anxietywatch-ezshare:
    image: ghcr.io/chenders/anxietywatch-server:latest
    container_name: anxietywatch-ezshare
    restart: unless-stopped
    # Opt-in poller for the ez Share WiFi SD card. Requires the host to have
    # joined the "ez Share" AP first (see the ez Share spec's Network Setup).
    # Start with:  docker compose --profile ezshare up -d anxietywatch-ezshare
    profiles:
    - ezshare
    # Host networking so it reaches the card AP at 192.168.4.1 via the host's
    # wlo1 route (a bridge network cannot); Postgres via the published port.
    network_mode: host
    environment:
      DATABASE_URL: postgresql://anxietywatch:${POSTGRES_PASSWORD}@127.0.0.1:5439/anxietywatch
    command:
    - sh
    - -c
    - 'while true; do python ezshare_sync.py || true; sleep 600; done'
    deploy: *id005
    logging: *id006
volumes:
  anxietywatch-pgdata: null
networks:
  anxietywatch-net:
    driver: bridge
