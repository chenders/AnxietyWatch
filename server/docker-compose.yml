services:
  anxietywatch-db:
    image: postgres:16-alpine
    container_name: anxietywatch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anxietywatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-anxietywatch}
    ports:
    - 127.0.0.1:5439:5432
    volumes:
    - anxietywatch-pgdata:/var/lib/postgresql/data
    networks:
    - anxietywatch-net
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER:-anxietywatch}
      interval: 5s
      timeout: 3s
      retries: 5
  anxietywatch-app:
    image: ghcr.io/chenders/anxietywatch-server:latest
    build: .
    container_name: anxietywatch-app
    restart: unless-stopped
    depends_on: &id001
      anxietywatch-db:
        condition: service_healthy
    environment: &id002
      DATABASE_URL: ${DATABASE_URL:-postgresql://anxietywatch:${POSTGRES_PASSWORD}@anxietywatch-db:5432/anxietywatch}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GENIUS_API_TOKEN: ${GENIUS_API_TOKEN:-}
      MUSIXMATCH_API_KEY: ${MUSIXMATCH_API_KEY:-}
    shm_size: 256mb
    ports:
    - 0.0.0.0:8081:8080
    networks: &id003
    - anxietywatch-net
  anxietywatch-app-ws:
    image: ghcr.io/chenders/anxietywatch-server:latest
    build: .
    container_name: anxietywatch-app-ws
    restart: unless-stopped
    # Start after the main app (not just the DB): the app runs startup
    # migrations, so ordering the WS behind it avoids concurrent-migration
    # contention and transient WS failures. (Dev app has no healthcheck, so
    # service_started is the best available ordering here.)
    depends_on:
      anxietywatch-db:
        condition: service_healthy
      anxietywatch-app:
        condition: service_started
    environment: *id002
    shm_size: 256mb
    ports:
    - 0.0.0.0:8082:8080
    networks: *id003
    command:
    - sh
    - -c
    - exec gunicorn --bind 0.0.0.0:8080 --workers 1 --worker-class gthread --threads
      10 --timeout 120 --access-logfile - 'server:create_app()'
volumes:
  anxietywatch-pgdata: null
networks:
  anxietywatch-net:
    driver: bridge
